services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmaerp
      POSTGRES_USER: pharmaerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaerp -d pharmaerp"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
